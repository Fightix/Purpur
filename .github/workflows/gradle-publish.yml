name: Build and Publish Purpur Paperclip

on:
  workflow_dispatch:
  push:
    branches:
      - "ver/1.20.1"

jobs:
  remove-old-packages:
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - name: Delete old package versions
        uses: smartsquaregmbh/delete-old-packages@v0.4.0
        with:
          repo: 'maven'
          token: ${{ secrets.REPOSITORY_TOKEN }}
          keep: 0
          names: |
            net.fightix.purpur.purpur-paperclip

  build-and-publish:
    needs: remove-old-packages
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Configure Git
        run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Apply Patches
        run: ./gradlew applyPatches --no-daemon --stacktrace

      - name: Create Paperclip Jar
        run: ./gradlew createReobfPaperclipJar --no-daemon --stacktrace

      - name: Rebuild on Failure
        if: ${{ failure() }}
        run: |
          ./gradlew clean cleanCache
          ./gradlew applyPatches --no-daemon --stacktrace 
          ./gradlew createReobfPaperclipJar --no-daemon --stacktrace

      - name: Publish Paperclip package
        run: ./gradlew publishPaperclipPublicationToGitHubPackagesRepository --no-daemon --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
